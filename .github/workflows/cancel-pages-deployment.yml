name: Cancel stuck Pages deployment

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Pages deployment ID reported as in progress
        required: true
        type: string

permissions:
  pages: write

jobs:
  cancel-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: github-pages
    steps:
      - name: Cancel and check Pages deployment
        uses: actions/github-script@v8
        env:
          PAGES_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        with:
          script: |
            const deploymentId = process.env.PAGES_DEPLOYMENT_ID.trim();
            if (!/^[a-zA-Z0-9-]+$/.test(deploymentId)) {
              throw new Error('Enter the Pages deployment ID from the failed run.');
            }
            const params = {
              ...context.repo,
              deploymentId
            };
            await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel',
              params
            );
            core.info(`Cancellation requested for ${deploymentId}.`);
            for (let attempt = 0; attempt < 24; attempt++) {
              const { data } = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}',
                params
              );
              core.info(`Pages deployment status: ${data.status}`);
              const terminalStates = [
                'succeed',
                'deployment_cancelled',
                'deployment_failed',
                'deployment_perms_error',
                'deployment_content_failed',
                'deployment_lost'
              ];
              if (terminalStates.includes(data.status)) {
                core.notice('The deployment is no longer in progress. Retry the publishing job.');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed(
              'GitHub still reports this deployment as active after cancellation. ' +
              'Contact GitHub Support with the deployment ID and failed run URL.'
            );
